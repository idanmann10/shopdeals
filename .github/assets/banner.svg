<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="shopdeals — the MCP server for shopping">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0f0c"/>
      <stop offset="60%" stop-color="#141512"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#f26b3a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f26b3a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f26b3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- magnifier + price-tag mark (matches mark.svg, scaled to 200) -->
  <g transform="translate(180, 60) scale(2.0)">
    <g fill="none" stroke="#f26b3a">
      <circle cx="42" cy="42" r="28" stroke-width="8"/>
      <line x1="62" y1="62" x2="86" y2="86" stroke-width="9" stroke-linecap="round"/>
    </g>
    <path d="M42 24 L54 24 L54 58 L42 70 L30 58 L30 36 Z" fill="#f26b3a"/>
    <circle cx="42" cy="34" r="3" fill="#0e0f0c"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(620, 160)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="92" font-weight="700" fill="#f5efe6" letter-spacing="-3">shopdeals</text>
    <text x="0" y="44" font-size="22" font-weight="500" fill="#f5efe6" fill-opacity="0.62" letter-spacing="0.5">The MCP server for shopping.</text>
  </g>

  <!-- accent underline -->
  <rect x="620" y="200" width="120" height="3" rx="1.5" fill="#f26b3a"/>
</svg>
