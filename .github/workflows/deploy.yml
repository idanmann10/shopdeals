name: Deploy

on:
  push:
    branches: [main]

# Required GitHub repo secrets:
#   FLY_API_TOKEN          — created via `fly tokens create deploy`
#
# Required Fly app secrets (set once with `fly secrets set ...`):
#   DATABASE_URL
#   CLERK_SECRET_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PRICE_STARTER
#   STRIPE_PRICE_PRO
#   FMTC_API_KEY
#   AWIN_API_TOKEN
#   AWIN_PUBLISHER_ID
#   IMPACT_ACCOUNT_SID
#   IMPACT_AUTH_TOKEN
#   KEEPA_API_KEY
#   VOYAGE_API_KEY

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Allow operators to bypass a deploy by including [skip deploy] in the
    # commit message — useful for docs-only commits.
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
